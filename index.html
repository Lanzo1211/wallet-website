<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TelePay - Ethiopian Digital Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="user-profile">
        <div class="avatar"><i class="fa-solid fa-user"></i></div>
        <div class="user-meta">
          <span class="greeting">Selam,</span>
          <span class="user-name">Biruk</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="Notifications"><i class="fa-regular fa-bell"></i></button>
        <button class="icon-btn" title="Help"><i class="fa-solid fa-headset"></i></button>
      </div>
    </header>
    <section class="balance-card">
      <div class="card-top">
        <div class="balance-label">
          <span>Available Balance</span>
          <button id="toggle-balance-btn" class="text-icon-btn" title="Toggle visibility">
            <i class="fa-regular fa-eye" id="eye-icon"></i>
          </button>
        </div>
        <span class="account-badge">Active (Ethio )</span>
      </div>

      <div class="card-main">
        <div class="currency-tag">ETB</div>
        <div class="balance-amount" id="balance-display">24,850.50</div>
      </div>

      <div class="account-number">
        <span>Phone: +251 90 000 004</span>
        <button class="copy-btn" id="copy-phone-btn" title="Copy Number">
          <i class="fa-regular fa-copy"></i>
        </button>
      </div>
    </section>
    <section class="quick-actions">
      <button class="action-btn" onclick="openModal('send-modal')">
        <div class="action-icon bg-primary"><i class="fa-solid fa-paper-plane"></i></div>
        <span>Send Money</span>
      </button>

      <button class="action-btn" onclick="openModal('receive-modal')">
        <div class="action-icon bg-secondary"><i class="fa-solid fa-qrcode"></i></div>
        <span>Receive / QR</span>
      </button>

      <button class="action-btn" onclick="openModal('airtime-modal')">
        <div class="action-icon bg-accent"><i class="fa-solid fa-mobile-screen"></i></div>
        <span>Buy Airtime</span>
      </button>

      <button class="action-btn" onclick="openModal('bills-modal')">
        <div class="action-icon bg-warning"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        <span>Pay Bills</span>
      </button>
    </section>
    <section class="services-banner">
      <div class="banner-content">
        <i class="fa-solid fa-bolt banner-icon"></i>
        <div>
          <h4>Ethio Electric & Water Utility</h4>
          <p>Pay your monthly utility bills with 0% service charge</p>
        </div>
      </div>
    </section>

    <section class="history-section">
      <div class="section-header">
        <h3>Recent Transactions</h3>
        <button class="see-all-btn">See All</button>
      </div>
      <ul class="transaction-list" id="transaction-list">
      </ul>
    </section>
  </div>


  <div class="modal-overlay" id="send-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Send Money</h3>
        <button class="close-btn" onclick="closeModal('send-modal')">&times;</button>
      </div>
      <form id="send-form">
        <div class="form-group">
          <label for="recipient-phone">Recipient Phone Number</label>
          <div class="input-with-prefix">
            <span class="prefix">+251</span>
            <input type="tel" id="recipient-phone" placeholder="9xxxxxxxx or 7xxxxxxxx" required maxlength="9" />
          </div>
        </div>

        <div class="form-group">
          <label for="send-amount">Amount (ETB)</label>
          <input type="number" id="send-amount" min="1" step="0.5" placeholder="0.00" required />
        </div>

        <div class="form-group">
          <label for="send-note">Reason / Note (Optional)</label>
          <input type="text" id="send-note" placeholder="e.g. Lunch, Coffee, Rent" />
        </div>

        <button type="submit" class="submit-btn">Confirm Transfer</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="receive-modal">
    <div class="modal-card text-center">
      <div class="modal-header">
        <h3>Receive Payment</h3>
        <button class="close-btn" onclick="closeModal('receive-modal')">&times;</button>
      </div>
      <div class="qr-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=telebirr:+251911234567" alt="TelePay QR" />
        <p class="qr-phone">+251 91 123 4567</p>
        <p class="qr-name">Biruk</p>
      </div>
      <button class="submit-btn secondary" onclick="copyToClipboard('+2519000004')">
        <i class="fa-regular fa-copy"></i> Copy Account Phone
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="airtime-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Buy Airtime / Package</h3>
        <button class="close-btn" onclick="closeModal('airtime-modal')">&times;</button>
      </div>
      <form id="airtime-form">
        <div class="form-group">
          <label for="airtime-phone">Ethio Telecom Mobile Number</label>
          <div class="input-with-prefix">
            <span class="prefix">+251</span>
            <input type="tel" id="airtime-phone" value="911234567" required maxlength="9" />
          </div>
        </div>
        <div class="form-group">
          <label>Select Amount (ETB)</label>
          <div class="chip-group">
            <button type="button" class="chip" onclick="setAirtimeAmount(25)">25</button>
            <button type="button" class="chip" onclick="setAirtimeAmount(50)">50</button>
            <button type="button" class="chip" onclick="setAirtimeAmount(100)">100</button>
            <button type="button" class="chip" onclick="setAirtimeAmount(200)">200</button>
          </div>
          <input type="number" id="airtime-amount" placeholder="Custom ETB" min="5" required />
        </div>
        <button type="submit" class="submit-btn">Recharge Now</button>
      </form>
    </div>
  </div>


  <div class="modal-overlay" id="bills-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Pay Utility Bill</h3>
        <button class="close-btn" onclick="closeModal('bills-modal')">&times;</button>
      </div>
      <form id="bill-form">
        <div class="form-group">
          <label>Service Provider</label>
          <select id="bill-type" required>
            <option value="Ethiopian Electric Utility (EEU)">Ethiopian Electric Utility (EEU)</option>
            <option value="Addis Ababa Water Supply (AAWSA)">Addis Ababa Water Authority (AAWSA)</option>
            <option value="Ethio Telecom Broadband">Ethio Telecom Fiber / Broadband</option>
            <option value="Traffic Penalty">Traffic Penalty Payment</option>
          </select>
        </div>
        <div class="form-group">
          <label>Customer / Meter Account ID</label>
          <input type="text" id="bill-customer-id" placeholder="e.g. 100293847" required />
        </div>
        <div class="form-group">
          <label>Bill Amount (ETB)</label>
          <input type="number" id="bill-amount" min="1" step="0.5" placeholder="0.00" required />
        </div>
        <button type="submit" class="submit-btn">Pay Bill</button>
      </form>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
